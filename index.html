<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Like API Tester</title>
<style>
  * { 
    box-sizing: border-box; 
    -webkit-tap-highlight-color: transparent; /* নীল স্কয়ার আলো বন্ধ */
  }
  html, body { 
    margin: 0; 
    padding: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden; 
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
    color: #fff; 
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    background: radial-gradient(circle at 80% 15%, #5b173d 0, transparent 34%),
                radial-gradient(circle at 20% 10%, #17264c 0, transparent 38%),
                #090d17;
  }
  .card {
    width: 100%;
    max-width: 400px;
    height: 100%;
    max-height: 600px;
    padding: 20px 16px;
    border: 1px solid rgba(255, 255, 255, 0.11);
    border-radius: 20px;
    background: rgba(24, 27, 43, 0.85);
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .status {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 6px 16px;
    border-radius: 20px;
    background: rgba(0, 255, 170, 0.07);
    border: 1px solid rgba(0, 255, 170, 0.22);
    color: #22f0a8;
    font-size: 13px;
    font-weight: 700;
    margin: 0 auto 12px;
    width: fit-content;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #12ef9e; box-shadow: 0 0 8px #12ef9e; }
  
  /* Input & Form Styling */
  .form-group { text-align: left; margin-bottom: 10px; }
  .form-group label { display: block; font-size: 13px; color: #a9afc2; margin-bottom: 5px; margin-left: 2px; }
  .input-field, .select-field {
    width: 100%;
    padding: 11px 14px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(6, 8, 16, 0.6);
    color: #fff;
    font-size: 15px;
    outline: none;
    transition: all 0.2s ease;
    -webkit-appearance: none;
  }
  .input-field:focus, .select-field:focus { 
    border-color: #00b7d9; 
    box-shadow: 0 0 8px rgba(0, 183, 217, 0.25); 
  }
  .select-field option { background: #181b2b; color: #fff; }

  /* Submit Button with Transition */
  .btn-submit {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(90deg, #4d3fff, #00b7d9);
    color: #fff;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    margin-top: 4px;
    outline: none;
    user-select: none;
    touch-action: manipulation;
    box-shadow: none;
    transition: transform 0.15s ease-in-out;
  }

  /* ১০০% থেকে ৯৫% হওয়ার জন্য ক্লিক / প্রেস অ্যাকশন */
  .btn-submit:active {
    transform: scale(0.95);
  }

  /* JS অ্যানিমেশনের জন্য সাপোর্ট ক্লাস */
  .btn-press-anim {
    transform: scale(0.95);
  }

  /* Response Box */
  .response-box {
    margin-top: 10px;
    padding: 12px;
    border-radius: 12px;
    background: rgba(6, 8, 16, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.08);
    text-align: left;
    height: 180px;
    display: flex;
    align-items: flex-start;
  }
  .response-box pre {
    margin: 0;
    width: 100%;
    height: 100%;
    font: 11.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #00ffaa;
    white-space: pre-wrap;
    word-break: break-all;
    overflow-y: auto;
  }

  /* Telegram Channel Button */
  .channel {
    display: block;
    padding: 12px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    font-weight: 700;
    margin-top: 8px;
    outline: none;
    user-select: none;
    transition: transform 0.15s ease-in-out;
  }
  .channel:active {
    transform: scale(0.98);
  }
</style>
</head>
<body>

<main class="card">
  <div>
    <div class="status"><span class="dot"></span>API IS ONLINE</div>

    <!-- Form Fields -->
    <div class="form-group">
      <label for="uid">Player UID</label>
      <input type="number" id="uid" class="input-field" placeholder="Enter FF UID" required>
    </div>

    <div class="form-group">
      <label for="key">API Key</label>
      <input type="text" id="key" class="input-field" placeholder="Enter Your Key" required>
    </div>

    <div class="form-group">
      <label for="server">Server Name</label>
      <select id="server" class="select-field">
        <option value="bd">BD (Bangladesh)</option>
        <option value="ind">IND (India)</option>
        <option value="sg">SG (Singapore)</option>
        <option value="br">BR (Brazil)</option>
        <option value="me">ME (Middle East)</option>
      </select>
    </div>

    <button id="likeBtn" class="btn-submit" onclick="sendLike()">❤️ SEND LIKE</button>
  </div>

  <!-- Response Box -->
  <div class="response-box">
    <pre id="jsonOutput">Ready...</pre>
  </div>

  <!-- Bottom Channel Link Only -->
  <a class="channel" href="https://t.me/kodexofc" target="_blank">✈ TELEGRAM CHANNEL OFC</a>
</main>

<script>
async function sendLike() {
  const btn = document.getElementById('likeBtn');
  const uid = document.getElementById('uid').value.trim();
  const key = document.getElementById('key').value.trim();
  const server = document.getElementById('server').value;
  const jsonOutput = document.getElementById('jsonOutput');

  // ক্লিক ইফেক্ট টিগার করা
  btn.classList.add('btn-press-anim');
  setTimeout(() => {
    btn.classList.remove('btn-press-anim');
  }, 150);

  if (!uid || !key) {
    alert("অনুগ্রহ করে UID এবং API Key দুটোই লিখুন!");
    return;
  }

  jsonOutput.style.color = '#ffd700';
  jsonOutput.textContent = 'Sending request...';

  const url = `/like?uid=${encodeURIComponent(uid)}&server_name=${encodeURIComponent(server)}&key=${encodeURIComponent(key)}`;

  try {
    const res = await fetch(url);
    const data = await res.json();
    
    jsonOutput.style.color = '#00ffaa';
    jsonOutput.textContent = JSON.stringify(data, null, 2);
  } catch (error) {
    jsonOutput.style.color = '#ff5555';
    jsonOutput.textContent = JSON.stringify({
      status: "error",
      message: "Failed to connect",
      error_details: error.message
    }, null, 2);
  }
}
</script>

</body>
</html>
